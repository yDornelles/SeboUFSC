<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Arquitetura - Sebo UFSC</title>
</head>
<body>
    <h2>Calculadora do Sebo</h2>
    
    <input type="number" id="valorA" placeholder="Número 1"><br><br>
    <input type="number" id="valorB" placeholder="Número 2"><br><br>
    
    <button onclick="enviarParaJava()">Calcular</button>

    <h3 style="color: blue;">Resultado: <span id="resultado">...</span></h3>

    <script>
        function enviarParaJava() {
            const a = parseFloat(document.getElementById('valorA').value);
            const b = parseFloat(document.getElementById('valorB').value);

            if (isNaN(a) || isNaN(b)) {
                alert("Digite os dois números!");
                return;
            }

            const payload = {
                valorA: a,
                valorB: b
            };

            fetch('http://localhost:8080/api/calculadora/somar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(resposta => resposta.json())
            .then(dados => {
                document.getElementById('resultado').innerText = dados.resultado;
            })
            .catch(erro => {
                document.getElementById('resultado').innerText = "Erro: Servidor desligado";
            });
        }
    </script>
</body>
</html>
